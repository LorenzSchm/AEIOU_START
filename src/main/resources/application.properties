spring.profiles.default=demo
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./var/demo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.mvc.async.request-timeout=60000
spring.task.scheduling.pool.size=4
server.address=${BIND_ADDRESS:127.0.0.1}
server.error.include-message=never
forwarder.kit=${START_KIT:start-kit}
forwarder.ui-token=${UI_TOKEN:}
forwarder.demo.tick-ms=${DEMO_TICK_MS:1000}
forwarder.demo.step-seconds=${DEMO_STEP_SECONDS:5}
forwarder.decision-seconds=${DECISION_SECONDS:90}
forwarder.reserve-seconds=${RESERVE_SECONDS:20}
