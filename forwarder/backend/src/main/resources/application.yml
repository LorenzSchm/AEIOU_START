spring:
  application:
    name: forwarder
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/forwarder}
    username: ${POSTGRES_USER:forwarder}
    password: ${POSTGRES_PASSWORD:forwarder}
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: true
  mvc:
    async:
      request-timeout: -1

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs

app:
  fiveu:
    base-url: ${FIVEU_BASE_URL:https://api.start-hack.5u.ai}
    api-key: ${TEAM_API_KEY:}
    mailbox-address: ${MAILBOX_ADDRESS:aeiou@hackloop.mail}
  # SAFETY: only ONE running instance may poll + send, otherwise customers get duplicate mails.
  # Both default to false; docker-compose enables them explicitly.
  poller:
    enabled: ${POLLER_ENABLED:false}
    interval-ms: ${POLLER_INTERVAL_MS:1000}
  mail:
    send-enabled: ${SEND_ENABLED:false}
    # false: mails to customers and tracking@ are dry runs; carriers and the rate desk still get real mail.
    customer-replies-enabled: ${CUSTOMER_REPLIES_ENABLED:false}
  llm:
    # Empty = 5U gateway (scored cost). Set both to call OpenAI directly for testing.
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model-router: ${LLM_MODEL_ROUTER:gpt-4o-mini}
    model-writer: ${LLM_MODEL_WRITER:gpt-4o-mini}
    model-extract: ${LLM_MODEL_EXTRACT:gpt-4o-mini}
  pricing:
    # Default EUR per USD behind the runtime setting fxEurPerUsd; the portal's latest fx_eur_per_usd overrides both.
    default-fx-eur-per-usd: ${DEFAULT_FX_EUR_PER_USD:0.86}
  start-kit-dir: ${START_KIT_DIR:../../start-kit}
