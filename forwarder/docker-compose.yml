services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forwarder
      POSTGRES_USER: ${POSTGRES_USER:-forwarder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forwarder}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forwarder} -d forwarder"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/forwarder
      POSTGRES_USER: ${POSTGRES_USER:-forwarder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forwarder}
      TEAM_API_KEY: ${TEAM_API_KEY}
      FIVEU_BASE_URL: ${FIVEU_BASE_URL:-https://api.start-hack.5u.ai}
      MAILBOX_ADDRESS: ${MAILBOX_ADDRESS:-aeiou@hackloop.mail}
      # Only this instance polls and sends. Never run a second live instance at the same time.
      POLLER_ENABLED: ${POLLER_ENABLED:-false}
      SEND_ENABLED: ${SEND_ENABLED:-false}
      # false = carriers and the rate desk get real mail, customers and tracking@ only dry runs (test mode).
      CUSTOMER_REPLIES_ENABLED: ${CUSTOMER_REPLIES_ENABLED:-false}
      # Both set = LLM calls go directly to OpenAI instead of the scored 5U gateway (test mode).
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      START_KIT_DIR: /start-kit
    volumes:
      - ../start-kit:/start-kit:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 5s
      timeout: 3s
      retries: 30

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
    ports:
      - "3000:3000"

volumes:
  pgdata:
