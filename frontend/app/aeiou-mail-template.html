<!doctype html>
<html lang="$language">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>AEIOU | Air freight offer</title>
  <style>
    .letter strong { display: inline-block; max-width: 100%; }
    @media (max-width: 420px) {
      .canvas { padding: 12px 8px !important; }
      .frame { padding: 8px 8px 0 !important; }
      .hero { padding-top: 94px !important; }
      .brand, .route-cell { display: block !important; width: auto !important; }
      .brand { padding: 11px 17px 0 !important; }
      .route-cell { padding: 3px 17px 14px !important; border-left: 0 !important; text-align: left !important; }
      .route { font-size: 32px !important; }
      .letter { padding: 24px 24px 30px !important; }
    }
    @media (prefers-reduced-transparency: reduce) {
      .glass { background-color: #e8eff2 !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
    }
  </style>
</head>
<body style="margin:0;background-color:#edf0ef;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#edf0ef">
    <tr><td class="canvas" align="center" style="padding:28px 12px;">
      <!--[if mso]><table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0"><tr><td><![endif]-->
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#fdfefd" style="max-width:600px;border:1px solid #d7dfdf;border-radius:16px;border-spacing:0;box-shadow:0 10px 28px rgba(27,43,61,.09);">
        <tr><td class="frame" style="padding:12px 12px 0;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
            <tr><td class="hero" bgcolor="#94b0c3" style="padding-top:133px;background-color:#94b0c3;background-image:url('$cloud_image_url');background-size:cover;background-position:49% 70%;background-repeat:no-repeat;border-radius:10px;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr><td class="glass" bgcolor="#e8eff2" style="background-color:#e8eff2;background-color:rgba(233,243,246,.78);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid #ffffff;border-radius:0 0 10px 10px;">
                  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                    <tr>
                      <td class="brand" width="112" style="padding:13px 12px 13px 20px;color:#203744;font-family:Arial,Helvetica,sans-serif;line-height:18px;">
                        <span style="font-size:14px;font-weight:700;letter-spacing:3.3px;">AEIOU</span><br>
                        <span style="color:#304c5a;font-size:10px;font-weight:700;letter-spacing:1px;">AIR FREIGHT</span>
                      </td>
                      <td class="route-cell" align="right" style="padding:14px 21px 15px 16px;border-left:1px solid #a9b9c2;">
                        <h1 class="route" style="margin:0;color:#172e3d;font-family:Arial,Helvetica,sans-serif;font-size:38px;font-weight:600;line-height:1.1;letter-spacing:-.045em;overflow-wrap:anywhere;">$lane</h1>
                      </td>
                    </tr>
                  </table>
                </td></tr>
              </table>
            </td></tr>
          </table>
        </td></tr>
        <tr><td class="letter" bgcolor="#fdfefd" style="padding:27px 34px 36px;background-color:#fdfefd;border-radius:0 0 15px 15px;color:#263841;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:26px;text-align:left;overflow-wrap:anywhere;">
          $message_html
        </td></tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td></tr>
  </table>
</body>
</html>
