plugins { id 'org.springframework.boot' }
dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.16')
    implementation project(':core')
    implementation project(':packing-tools')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework:spring-jdbc'
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    implementation 'org.xerial:sqlite-jdbc:3.54.1.0'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('processResources') {
    from(rootProject.file('data')) { into 'kit' }
    from(rootProject.file('../start-kit')) { include '*.csv'; into 'kit' }
    from(rootProject.file('cloudline')) {
        include 'mail-designs/cloudline.html', 'mail-designs/assets/**'
        into 'cloudline'
    }
}

// The optional native readers run in their own JVM and stay off the Spring classpath.
tasks.register('edgeBundle', Zip) {
    dependsOn tasks.named('bootJar'), gradle.includedBuild('edgelab').task(':installDist')
    archiveFileName = 'dispatch-with-edge-tools.zip'
    from(tasks.named('bootJar')) { rename { 'wave.jar' } }
    from(rootProject.file('../edgelab/build/install/edgelab/lib')) { into 'edge-reader/lib' }
}

if (project.hasProperty('testEdgeBundle')) {
    tasks.named('test') {
        dependsOn gradle.includedBuild('edgelab').task(':installDist')
        def libs = rootProject.file('../edgelab/build/install/edgelab/lib')
        inputs.dir(libs)
        systemProperty 'test.edge.lib', libs.absolutePath
        environment 'EDGELAB_GATEWAY_ENABLED', 'false'
    }
}
