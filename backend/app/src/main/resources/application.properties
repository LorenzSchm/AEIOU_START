server.address=127.0.0.1
server.port=8000
spring.config.import=optional:file:./.env[.properties]
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs
dispatch.db=${DISPATCH_DB:backend/state/dispatch.sqlite3}
dispatch.tariff-dir=${DISPATCH_TARIFF_DIR:backend/data}
dispatch.base-url=${FIVEU_BASE_URL:https://api.start-hack.5u.ai}
dispatch.key=${TEAM_API_KEY:}
dispatch.portal-page=${FIVEU_PORTAL_PAGE:https://start-hack.5u.ai/portal/ui}
dispatch.portal-clearance=${FIVEU_CF_CLEARANCE:}
dispatch.portal-user-agent=${FIVEU_CF_USER_AGENT:}
dispatch.portal-browser=${FIVEU_PORTAL_BROWSER:}
dispatch.portal-headless=${FIVEU_PORTAL_HEADLESS:true}
dispatch.auto=${AUTO_SEND:true}
dispatch.read-only=${DISPATCH_READ_ONLY:false}
dispatch.poll-ms=1000
dispatch.webhook-secret=${DISPATCH_WEBHOOK_SECRET:}
dispatch.bid-wait-seconds=${DISPATCH_BID_WAIT_SECONDS:32}
dispatch.counteroffers=${DISPATCH_COUNTEROFFERS:false}
spring.jackson.property-naming-strategy=SNAKE_CASE
dispatch.start-at=${DISPATCH_START_AT:2026-11-21T15:00:00Z}
spring.task.scheduling.pool.size=5
dispatch.gateway-model=${DISPATCH_OPENAI_MODEL:${FIVEU_GATEWAY_MODEL:gpt-4o-mini}}
dispatch.llm-direct=${DISPATCH_LLM_DIRECT:true}
dispatch.llm-quote-gateway=${DISPATCH_LLM_QUOTE_GATEWAY:true}
dispatch.gateway-standard-extraction=${DISPATCH_GATEWAY_STANDARD_EXTRACTION:true}
dispatch.openai-key=${OPENAI_API_KEY:}
dispatch.transcription-key-file=${DISPATCH_OPENAI_KEY_FILE:backend/state/openai.key}
dispatch.translation-model=${TRANSLATION_MODEL:gpt-4o-mini}
# Cloudline HTML for quotes stays off until a 5U test thread shows it rendered.
dispatch.quote-html=${QUOTE_HTML:false}
postgres.url=${DATABASE_URL:}
postgres.sync-ms=5000
