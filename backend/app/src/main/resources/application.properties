server.address=127.0.0.1
server.port=8000
spring.config.import=optional:file:./.env[.properties]
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs
dispatch.db=${DISPATCH_DB:backend/state/dispatch.sqlite3}
dispatch.base-url=${FIVEU_BASE_URL:https://api.start-hack.5u.ai}
dispatch.key=${TEAM_API_KEY:}
dispatch.auto=${AUTO_SEND:true}
dispatch.poll-ms=1000
dispatch.bid-wait-seconds=40
dispatch.counteroffers=${DISPATCH_COUNTEROFFERS:false}
spring.jackson.property-naming-strategy=SNAKE_CASE
dispatch.start-at=${DISPATCH_START_AT:2026-11-21T15:00:00Z}
spring.task.scheduling.pool.size=4
dispatch.gateway-model=${FIVEU_GATEWAY_MODEL:gpt-4o-mini}
